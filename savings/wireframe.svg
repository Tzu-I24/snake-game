<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="760" viewBox="0 0 1240 760" font-family="'Noto Sans CJK TC','Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif">
  <rect width="1240" height="760" fill="#fbfaf6"/>
  <text x="40" y="44" font-size="24" font-weight="700" fill="#222">存錢小幫手｜畫面草稿（Wireframe）</text>
  <text x="40" y="70" font-size="14" fill="#777">手機版 3 個主要畫面 · 底部 6 個分頁：總覽 / 計畫 / 目標 / 記帳 / 挑戰 / 冷靜</text>

  <defs>
    <g id="nav">
      <rect x="0" y="560" width="300" height="50" fill="#eee" stroke="#555" stroke-width="1.5"/>
      <g font-size="11" fill="#555" text-anchor="middle">
        <text x="25" y="590">總覽</text><text x="75" y="590">計畫</text><text x="125" y="590">目標</text>
        <text x="175" y="590">記帳</text><text x="225" y="590">挑戰</text><text x="275" y="590">冷靜</text>
      </g>
    </g>
  </defs>

  <!-- ========== 畫面 1：總覽 ========== -->
  <g transform="translate(40,100)">
    <text x="0" y="-8" font-size="16" font-weight="700" fill="#1f8a5b">① 總覽（首頁）</text>
    <rect x="0" y="0" width="300" height="610" rx="22" fill="#fff" stroke="#333" stroke-width="2"/>
    <text x="16" y="34" font-size="16" font-weight="700">💰 存錢小幫手</text><text x="284" y="34" font-size="11" fill="#888" text-anchor="end">11月5日 週四</text>
    <rect x="14" y="48" width="272" height="196" rx="10" fill="none" stroke="#555" stroke-dasharray="5 4"/>
    <text x="26" y="70" font-size="11" fill="#888">已存總額</text>
    <text x="26" y="102" font-size="28" font-weight="700">$48,350</text>
    <g font-size="10" fill="#888">
      <rect x="26" y="114" width="122" height="44" rx="6" fill="#f1f1f1"/><text x="34" y="130">本月已存 / 目標</text><text x="34" y="150" font-size="13" fill="#222" font-weight="700">$6,000 / $8,000</text>
      <rect x="154" y="114" width="122" height="44" rx="6" fill="#f1f1f1"/><text x="162" y="130">連續存錢</text><text x="162" y="150" font-size="13" fill="#222" font-weight="700">12 天 🔥</text>
      <rect x="26" y="164" width="122" height="44" rx="6" fill="#f1f1f1"/><text x="34" y="180">今天還能花</text><text x="34" y="200" font-size="13" fill="#222" font-weight="700">$610</text>
      <rect x="154" y="164" width="122" height="44" rx="6" fill="#f1f1f1"/><text x="162" y="180">本月剩餘可花</text><text x="162" y="200" font-size="13" fill="#222" font-weight="700">$15,240</text>
    </g>
    <rect x="26" y="218" width="250" height="9" rx="4" fill="#ddd"/><rect x="26" y="218" width="188" height="9" rx="4" fill="#1f8a5b"/>
    <text x="26" y="240" font-size="10" fill="#888">本月儲蓄目標完成 75%</text>

    <rect x="14" y="254" width="272" height="40" rx="8" fill="#fdeee6" stroke="#c2410c"/>
    <text x="24" y="279" font-size="11" fill="#c2410c">⚠️ 提醒區：超支 / 發薪日先存 $2,000</text>

    <rect x="14" y="304" width="272" height="100" rx="10" fill="none" stroke="#555" stroke-dasharray="5 4"/>
    <text x="26" y="326" font-size="13" font-weight="700">快速存一筆</text>
    <rect x="26" y="336" width="90" height="28" rx="5" fill="#f1f1f1" stroke="#999"/><text x="34" y="355" font-size="11" fill="#999">金額</text>
    <rect x="122" y="336" width="90" height="28" rx="5" fill="#f1f1f1" stroke="#999"/><text x="130" y="355" font-size="11" fill="#999">目標 ▾</text>
    <rect x="218" y="336" width="58" height="28" rx="5" fill="#1f8a5b"/><text x="247" y="355" font-size="12" fill="#fff" text-anchor="middle">存入</text>
    <rect x="26" y="372" width="250" height="24" rx="5" fill="#e3f4ec"/><text x="34" y="388" font-size="10" fill="#1f6b48">💡 每日存錢小技巧</text>

    <rect x="14" y="414" width="272" height="136" rx="10" fill="none" stroke="#555" stroke-dasharray="5 4"/>
    <text x="26" y="436" font-size="13" font-weight="700">最近紀錄</text>
    <g font-size="11"><text x="26" y="462">🟢 存入 手動存入</text><text x="274" y="462" text-anchor="end">+$500</text>
    <text x="26" y="488">🔴 花費 午餐</text><text x="274" y="488" text-anchor="end">-$120</text>
    <text x="26" y="514">🟢 存入 放棄購買：耳機</text><text x="274" y="514" text-anchor="end">+$2,990</text>
    <text x="26" y="540" fill="#aaa">…</text></g>
    <use href="#nav"/><rect x="0" y="560" width="50" height="50" fill="#1f8a5b" opacity=".15"/>
  </g>

  <!-- ========== 畫面 2：計畫 + 目標 ========== -->
  <g transform="translate(470,100)">
    <text x="0" y="-8" font-size="16" font-weight="700" fill="#1f8a5b">② 先存後花 + 目標</text>
    <rect x="0" y="0" width="300" height="610" rx="22" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="14" y="20" width="272" height="250" rx="10" fill="none" stroke="#555" stroke-dasharray="5 4"/>
    <text x="26" y="44" font-size="13" font-weight="700">每月計畫（計畫分頁）</text>
    <g font-size="10" fill="#888">
      <text x="26" y="64">每月收入</text><rect x="26" y="68" width="120" height="24" rx="5" fill="#f1f1f1" stroke="#999"/><text x="32" y="84" fill="#222">40,000</text>
      <text x="156" y="64">固定支出</text><rect x="156" y="68" width="120" height="24" rx="5" fill="#f1f1f1" stroke="#999"/><text x="162" y="84" fill="#222">16,000</text>
      <text x="26" y="108">儲蓄比例 %</text><rect x="26" y="112" width="120" height="24" rx="5" fill="#f1f1f1" stroke="#999"/><text x="32" y="128" fill="#222">20</text>
      <text x="156" y="108">發薪日</text><rect x="156" y="112" width="120" height="24" rx="5" fill="#f1f1f1" stroke="#999"/><text x="162" y="128" fill="#222">5 號</text>
    </g>
    <g font-size="11"><line x1="26" y1="148" x2="276" y2="148" stroke="#ddd"/>
      <text x="26" y="168">① 發薪日先存</text><text x="276" y="168" text-anchor="end" font-weight="700">$8,000</text>
      <text x="26" y="190">② 固定支出</text><text x="276" y="190" text-anchor="end" font-weight="700">$16,000</text>
      <text x="26" y="212">③ 剩下可以花</text><text x="276" y="212" text-anchor="end" font-weight="700">$16,000</text>
      <text x="26" y="234" fill="#888">　平均每天可花</text><text x="276" y="234" text-anchor="end">$533</text>
      <text x="26" y="256" fill="#888">　一年可存下</text><text x="276" y="256" text-anchor="end" fill="#1f8a5b" font-weight="700">$96,000</text></g>

    <rect x="14" y="284" width="272" height="266" rx="10" fill="none" stroke="#555" stroke-dasharray="5 4"/>
    <text x="26" y="308" font-size="13" font-weight="700">我的目標（目標分頁）</text>
    <g font-size="11">
      <rect x="26" y="318" width="250" height="70" rx="8" fill="none" stroke="#999"/>
      <text x="36" y="338" font-weight="700">緊急預備金</text><text x="266" y="338" text-anchor="end">$32,000 / $60,000</text>
      <rect x="36" y="346" width="230" height="8" rx="4" fill="#ddd"/><rect x="36" y="346" width="123" height="8" rx="4" fill="#1f8a5b"/>
      <rect x="36" y="362" width="170" height="18" rx="9" fill="#e3f4ec"/><text x="44" y="375" font-size="9" fill="#1f6b48">每天 $154｜每週 $1,077｜每月 $4,615</text>
      <rect x="26" y="398" width="250" height="70" rx="8" fill="none" stroke="#999"/>
      <text x="36" y="418" font-weight="700">日本旅行</text><text x="266" y="418" text-anchor="end">$16,350 / $40,000</text>
      <rect x="36" y="426" width="230" height="8" rx="4" fill="#ddd"/><rect x="36" y="426" width="94" height="8" rx="4" fill="#1f8a5b"/>
      <rect x="36" y="442" width="170" height="18" rx="9" fill="#e3f4ec"/><text x="44" y="455" font-size="9" fill="#1f6b48">每天 $98｜每週 $686｜每月 $2,940</text>
      <rect x="216" y="440" width="50" height="22" rx="5" fill="#1f8a5b"/><text x="241" y="455" fill="#fff" font-size="10" text-anchor="middle">存入</text>
      <rect x="26" y="478" width="250" height="60" rx="8" fill="none" stroke="#bbb" stroke-dasharray="3 3"/>
      <text x="151" y="512" text-anchor="middle" fill="#999">＋ 新增目標（名稱 / 金額 / 期限）</text>
    </g>
    <use href="#nav"/>
  </g>

  <!-- ========== 畫面 3：挑戰 + 冷靜清單 ========== -->
  <g transform="translate(900,100)">
    <text x="0" y="-8" font-size="16" font-weight="700" fill="#1f8a5b">③ 存錢挑戰 + 冷靜清單</text>
    <rect x="0" y="0" width="300" height="610" rx="22" fill="#fff" stroke="#333" stroke-width="2"/>
    <rect x="14" y="20" width="272" height="250" rx="10" fill="none" stroke="#555" stroke-dasharray="5 4"/>
    <text x="26" y="44" font-size="13" font-weight="700">365 天存錢挑戰</text>
    <text x="26" y="62" font-size="10" fill="#888">每天點一格，存格子上的金額 · 全部完成 $66,795</text>
    <rect x="26" y="70" width="250" height="7" rx="3" fill="#ddd"/><rect x="26" y="70" width="40" height="7" rx="3" fill="#1f8a5b"/>
    <g font-size="9" text-anchor="middle">
      <!-- grid of cells -->
      <g id="cellrow">
        <rect x="26" y="86" width="30" height="22" rx="3" fill="#1f8a5b"/><text x="41" y="101" fill="#fff">1</text>
        <rect x="58" y="86" width="30" height="22" rx="3" fill="#f1f1f1" stroke="#bbb"/><text x="73" y="101">2</text>
        <rect x="90" y="86" width="30" height="22" rx="3" fill="#1f8a5b"/><text x="105" y="101" fill="#fff">3</text>
        <rect x="122" y="86" width="30" height="22" rx="3" fill="#f1f1f1" stroke="#bbb"/><text x="137" y="101">4</text>
        <rect x="154" y="86" width="30" height="22" rx="3" fill="#f1f1f1" stroke="#bbb"/><text x="169" y="101">5</text>
        <rect x="186" y="86" width="30" height="22" rx="3" fill="#1f8a5b"/><text x="201" y="101" fill="#fff">6</text>
        <rect x="218" y="86" width="30" height="22" rx="3" fill="#f1f1f1" stroke="#bbb"/><text x="233" y="101">7</text>
        <rect x="250" y="86" width="26" height="22" rx="3" fill="#f1f1f1" stroke="#bbb"/><text x="263" y="101">8</text>
      </g>
      <use href="#cellrow" y="28"/><use href="#cellrow" y="56"/><use href="#cellrow" y="84"/><use href="#cellrow" y="112"/>
      <text x="151" y="252" fill="#999" font-size="11">… 共 365 格（可切換 52 週模式）</text>
    </g>

    <rect x="14" y="284" width="272" height="266" rx="10" fill="none" stroke="#555" stroke-dasharray="5 4"/>
    <text x="26" y="308" font-size="13" font-weight="700">想買清單｜72 小時冷靜期</text>
    <rect x="26" y="318" width="140" height="26" rx="5" fill="#f1f1f1" stroke="#999"/><text x="32" y="335" font-size="10" fill="#999">想買什麼</text>
    <rect x="170" y="318" width="50" height="26" rx="5" fill="#f1f1f1" stroke="#999"/><text x="176" y="335" font-size="10" fill="#999">價格</text>
    <rect x="224" y="318" width="52" height="26" rx="5" fill="#1f8a5b"/><text x="250" y="335" font-size="10" fill="#fff" text-anchor="middle">放進去</text>
    <g font-size="11">
      <rect x="26" y="354" width="250" height="62" rx="8" fill="none" stroke="#999"/>
      <text x="36" y="374" font-weight="700">新球鞋</text><text x="266" y="374" text-anchor="end">$3,280</text>
      <rect x="36" y="384" width="100" height="20" rx="10" fill="#fdeee6"/><text x="44" y="398" font-size="9" fill="#c2410c">還要等 41 小時</text>
      <rect x="168" y="382" width="98" height="24" rx="5" fill="#1f8a5b"/><text x="217" y="398" font-size="10" fill="#fff" text-anchor="middle">不買了，存起來</text>
      <rect x="26" y="424" width="250" height="62" rx="8" fill="none" stroke="#999"/>
      <text x="36" y="444" font-weight="700">藍牙喇叭</text><text x="266" y="444" text-anchor="end">$1,590</text>
      <rect x="36" y="454" width="120" height="20" rx="10" fill="#e3f4ec"/><text x="44" y="468" font-size="9" fill="#1f6b48">冷靜期結束，還想要嗎？</text>
      <rect x="168" y="452" width="62" height="24" rx="5" fill="#1f8a5b"/><text x="199" y="468" font-size="9" fill="#fff" text-anchor="middle">存起來</text>
      <rect x="234" y="452" width="32" height="24" rx="5" fill="none" stroke="#999"/><text x="250" y="468" font-size="10" text-anchor="middle">買</text>
      <text x="26" y="512" fill="#888" font-size="10">靠冷靜清單省下的錢</text>
      <text x="26" y="538" font-size="20" font-weight="700">$4,580</text>
    </g>
    <use href="#nav"/>
  </g>
</svg>
